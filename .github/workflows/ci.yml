name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: https://nexcard.io
  REVALIDATION_SECRET: ci-test-revalidation-secret
  CRON_SECRET: ci-test-cron-secret

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit & API tests with coverage
        run: npm run test:coverage

  e2e:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://nexcard:nexcard@127.0.0.1:3306/nexcard_ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REVALIDATION_SECRET: ci-test-revalidation-secret
      ALLOW_LOCAL_STORAGE: "true"
      STORAGE_DRIVER: local
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CI: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexcard_ci
          MYSQL_USER: nexcard
          MYSQL_PASSWORD: nexcard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npm run db:migrate:prod

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://nexcard:nexcard@127.0.0.1:3306/nexcard_ci
      ALLOW_LOCAL_STORAGE: "true"
      STORAGE_DRIVER: local
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexcard_ci
          MYSQL_USER: nexcard
          MYSQL_PASSWORD: nexcard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npm run db:migrate:prod

      - name: Build application
        run: npm run build
