name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: https://nexcard.io
  REVALIDATION_SECRET: ci-test-revalidation-secret

jobs:
  quality:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit & API tests
        run: npm test

  # Optional: uncomment when Playwright browsers are installed in CI
  # e2e:
  #   name: E2E Smoke Tests
  #   runs-on: ubuntu-latest
  #   needs: quality
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: "22"
  #         cache: npm
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npm run build
  #     - run: npm run test:e2e
  #       env:
  #         CI: true
  #         DATABASE_URL: mysql://nexcard:nexcard@127.0.0.1:3306/nexcard_ci
  #         PLAYWRIGHT_BASE_URL: http://localhost:3000

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    env:
      NODE_ENV: production
      DATABASE_URL: mysql://nexcard:nexcard@127.0.0.1:3306/nexcard_ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexcard_ci
          MYSQL_USER: nexcard
          MYSQL_PASSWORD: nexcard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npm run db:migrate:prod

      - name: Build application
        run: npm run build
